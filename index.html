<!DOCTYPE html>
<html lang="fa">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <title>Milad Noor</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }

    .screen {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .screen img {
      display: block;
      width: 100%;
      height: 50%;
      flex: 0 0 50%;
      object-fit: cover;
      object-position: center;
    }
  </style>
</head>
<body>
  <div class="screen">
    <img src="m1.jpg" alt="">
    <img src="m2.jpg" alt="">
  </div>
</body>
</html>

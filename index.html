<!DOCTYPE html>
<html lang="fa">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#000000">

  <title>Milad Noor</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      background: #000;
      overflow: hidden;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #photo {
      width: 100vw;
      height: 100vh;
      object-fit: contain;
      display: block;
      cursor: pointer;
    }
  </style>
</head>

<body>

  <img
    id="photo"
    src="https://drive.google.com/uc?export=view&id=1iXlFg4MKrpGvR2oNC9IEaevmMPeHw_0V"
    alt="Milad Noor"
  >

  <script>
    const photo = document.getElementById("photo");

    photo.addEventListener("click", async () => {
      try {
        if (!document.fullscreenElement &&
            document.documentElement.requestFullscreen) {
          await document.documentElement.requestFullscreen();
        }
      } catch (e) {}
    });
  </script>

</body>
</html>
